<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="480" viewBox="-10 -10 1220 480" role="img" aria-label="Speech becomes text, which goes to the talker and the Jev router at once. The talker's reply is held until Jev routes the turn: chat and status questions release it to speech; every other route drops it. A new task starts a Hermes run and plays a pre-rendered acknowledgement after 0.1 s or once the run starts; other routes get a short new reply.">
<style>
svg{--surface:#FFFFFF;--surface-2:#E9EBF1;--ink:#1A1F2B;--ink-2:#7A8294;--muted:#5D6474;--line:#CDD2DC;--grid:#E1E4EB;--rose:#C23B6E;--rose-soft:#EBB3C8;--teal:#0E7F86}
@media (prefers-color-scheme: dark){svg{--surface:#1A1E27;--surface-2:#232834;--ink:#E7E9EF;--ink-2:#8C94A5;--muted:#9AA1B0;--line:#363C4A;--grid:#252A35;--rose:#F07AA3;--rose-soft:#7A3C55;--teal:#45C2C8}}
.bg{fill:var(--surface);stroke:var(--line);stroke-width:1}
text{fill:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.t{font-size:13px;font-weight:600}
.s{font-size:11px;fill:var(--muted)}
.m{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px;fill:var(--ink)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
.box.hinge{stroke:var(--ink);stroke-width:1.75}
.box.ext{fill:var(--surface-2)}
.box.slow{stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--ink);stroke-width:1.5}
.ln.rt{stroke:var(--rose)}
.ln.tk{stroke:var(--teal)}
.ln.dash{stroke-dasharray:5 4}
.ah{fill:var(--ink)}
.ah.rt{fill:var(--rose)}
.ah.tk{fill:var(--teal)}
.lbl{font-size:11px;fill:var(--muted)}
.lbl.rt{fill:var(--rose)}
.lbl.tk{fill:var(--teal)}
.grid{stroke:var(--grid);stroke-width:1}
.bar-route{fill:var(--ink-2)}
.bar-talk{fill:var(--rose)}
.bar-open{fill:var(--rose-soft)}
.tick{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;fill:var(--muted)}
</style>
<rect class="bg" x="-9.5" y="-9.5" width="1219" height="479" rx="8"/>

          <defs>
            <marker id="f1-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
            <marker id="f1-rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah rt" d="M0 0L10 5L0 10z"/></marker>
            <marker id="f1-tk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah tk" d="M0 0L10 5L0 10z"/></marker>
          </defs>

          <!-- input -->
          <rect class="box ext" x="20" y="140" width="110" height="64" rx="6"/>
          <text class="t" x="75" y="167" text-anchor="middle">Browser mic</text>
          <text class="s" x="75" y="185" text-anchor="middle">VAD cuts speech</text>

          <rect class="box" x="170" y="140" width="130" height="64" rx="6"/>
          <text class="t" x="235" y="167" text-anchor="middle">ASR</text>
          <text class="s" x="235" y="185" text-anchor="middle">SenseVoice · sherpa</text>

          <path class="ln" d="M130 172 H168" marker-end="url(#f1-ah)"/>
          <text class="lbl" x="150" y="164" text-anchor="middle">audio</text>

          <path class="ln" d="M300 172 H325 V92 H348" marker-end="url(#f1-ah)"/>
          <path class="ln" d="M325 172 V252 H348" marker-end="url(#f1-ah)"/>
          <text class="lbl" x="333" y="176">text, to both at once</text>

          <!-- talker + router -->
          <text class="lbl" x="445" y="46" text-anchor="middle">prompt: SOUL.md · USER.md · summary + last 50 turns · task state</text>
          <rect class="box" x="350" y="60" width="190" height="64" rx="6"/>
          <text class="t" x="445" y="82" text-anchor="middle">Talker</text>
          <text class="s" x="445" y="99" text-anchor="middle">DeepSeek v4.1 flash</text>
          <text class="s" x="445" y="114" text-anchor="middle">2nd provider: raced, or at 1.5 s</text>

          <rect class="box" x="350" y="220" width="190" height="64" rx="6"/>
          <text class="t" x="445" y="242" text-anchor="middle">Jev router</text>
          <text class="s" x="445" y="259" text-anchor="middle">typesafe/jev-1.13</text>
          <text class="s" x="445" y="274" text-anchor="middle">gives up after 1.5 s</text>

          <rect class="box slow" x="350" y="340" width="190" height="56" rx="6"/>
          <text class="t" x="445" y="362" text-anchor="middle">Fallback router</text>
          <text class="s" x="445" y="380" text-anchor="middle">Llama 3.3 70B on Groq</text>
          <path class="ln dash" d="M445 340 V286" marker-end="url(#f1-ah)"/>
          <text class="lbl" x="453" y="318">raced if Jev &gt; 0.6 s</text>

          <!-- hold + route -->
          <rect class="box" x="590" y="60" width="170" height="64" rx="6"/>
          <text class="t" x="675" y="82" text-anchor="middle">Held reply</text>
          <text class="s" x="675" y="99" text-anchor="middle">streams, not spoken yet</text>
          <text class="s" x="675" y="114" text-anchor="middle">opener may play at 0.7 s</text>
          <path class="ln rt" d="M540 92 H588" marker-end="url(#f1-rt)"/>
          <text class="lbl rt" x="565" y="84" text-anchor="middle">tokens</text>

          <rect class="box hinge" x="590" y="220" width="170" height="80" rx="6"/>
          <text class="t" x="675" y="242" text-anchor="middle">Route</text>
          <text class="s" x="675" y="259" text-anchor="middle">chat · status · task · change</text>
          <text class="s" x="675" y="274" text-anchor="middle">cancel · unsure · approval</text>
          <text class="s" x="675" y="289" text-anchor="middle">unsure at p 0.35–0.65</text>
          <path class="ln" d="M540 252 H588" marker-end="url(#f1-ah)"/>
          <text class="lbl" x="565" y="244" text-anchor="middle">route</text>

          <path class="ln rt" d="M675 220 V126" marker-end="url(#f1-rt)"/>
          <text class="lbl rt" x="683" y="168">chat, status: release</text>
          <text class="lbl" x="683" y="183">others: drop it</text>

          <!-- speak -->
          <rect class="box" x="810" y="60" width="170" height="64" rx="6"/>
          <text class="t" x="895" y="82" text-anchor="middle">Speak</text>
          <text class="s" x="895" y="99" text-anchor="middle">opener clip, sentences</text>
          <text class="s" x="895" y="114" text-anchor="middle">Azure TTS, edge-tts backup</text>
          <path class="ln rt" d="M760 92 H808" marker-end="url(#f1-rt)"/>

          <rect class="box ext" x="1060" y="60" width="120" height="224" rx="6"/>
          <text class="t" x="1120" y="166" text-anchor="middle">Browser avatar</text>
          <text class="s" x="1120" y="184" text-anchor="middle">Live2D + audio</text>
          <path class="ln rt" d="M980 92 H1058" marker-end="url(#f1-rt)"/>
          <text class="lbl rt" x="1019" y="84" text-anchor="middle">audio</text>

          <!-- task path -->
          <rect class="box" x="810" y="220" width="170" height="64" rx="6"/>
          <text class="t" x="895" y="242" text-anchor="middle">Ack clip</text>
          <text class="s" x="895" y="259" text-anchor="middle">pre-rendered “on it” line</text>
          <text class="s" x="895" y="274" text-anchor="middle">never sees your words</text>
          <path class="ln rt" d="M980 252 H1058" marker-end="url(#f1-rt)"/>
          <text class="lbl rt" x="1019" y="244" text-anchor="middle">audio</text>

          <rect class="box" x="810" y="340" width="170" height="56" rx="6"/>
          <text class="t" x="895" y="362" text-anchor="middle">Task manager</text>
          <text class="s" x="895" y="380" text-anchor="middle">up to 3 runs · 600 s each</text>
          <path class="ln tk" d="M675 300 V368 H808" marker-end="url(#f1-tk)"/>
          <text class="lbl tk" x="742" y="360" text-anchor="middle">new task</text>
          <path class="ln tk" d="M895 340 V286" marker-end="url(#f1-tk)"/>
          <text class="lbl tk" x="903" y="318">after 0.1 s or on start</text>

          <rect class="box ext" x="1060" y="340" width="120" height="56" rx="6"/>
          <text class="t" x="1120" y="362" text-anchor="middle">Hermes agent</text>
          <text class="s" x="1120" y="380" text-anchor="middle">localhost:8642</text>
          <path class="ln tk" d="M980 368 H1058" marker-end="url(#f1-tk)"/>
          <text class="m lbl tk" x="1019" y="360" text-anchor="middle">/v1/runs</text>
        
  <g transform="translate(20 436)">
    <line class="ln rt" x1="0" y1="-4" x2="30" y2="-4"/><text class="lbl" x="38" y="0">What you hear</text>
    <line class="ln tk" x1="150" y1="-4" x2="180" y2="-4"/><text class="lbl" x="188" y="0">Background task</text>
    <line class="ln" x1="310" y1="-4" x2="340" y2="-4"/><text class="lbl" x="348" y="0">Input and routing</text>
    <line class="ln dash" x1="470" y1="-4" x2="500" y2="-4"/><text class="lbl" x="508" y="0">Only when the first try is slow</text>
    <text class="lbl" x="720" y="0">Grey boxes are outside the server; talker, Jev and TTS call hosted models</text>
  </g>
</svg>
